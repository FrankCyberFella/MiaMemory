<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mia's Memory Game</title>
<meta name="theme-color" content="#7b2ff7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mia's Memory Game">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --purple: #7b2ff7;
    --pink: #ff6fa9;
    --teal: #21d4c4;
    --gold: #ffc93c;
    --green: #34d16b;
    --card-back-1: #ff9a3c;
    --card-back-2: #ff3c78;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Rounded", "Trebuchet MS", "Comic Sans MS", sans-serif;
    background: linear-gradient(160deg, var(--purple), var(--pink) 60%, var(--gold));
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    color: #2b1a4a;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .app {
    width: 100%;
    max-width: 760px;
    padding: 14px 14px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
    margin-bottom: 10px;
  }

  h1 {
    margin: 6px 0 4px;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    letter-spacing: 0.5px;
  }

  .stats {
    font-size: clamp(1rem, 4vw, 1.3rem);
    font-weight: 600;
  }

  .stars {
    letter-spacing: 2px;
    font-size: 1.1em;
  }

  .controls {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }

  .control-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .control-group button, .new-game-btn {
    border: none;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 1rem;
    font-weight: 700;
    background: rgba(255,255,255,0.85);
    color: #4a2e8a;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
    transition: transform 0.1s ease, background 0.15s ease;
    touch-action: manipulation;
  }

  .control-group button.active {
    background: var(--gold);
    color: #4a2e00;
  }

  .control-group button:active, .new-game-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.15);
  }

  .new-game-btn {
    background: var(--teal);
    color: #05332d;
    font-size: 1.05rem;
    padding: 12px 22px;
  }

  .board {
    display: grid;
    gap: 10px;
    width: 100%;
    max-width: 680px;
  }

  .board.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .board.cols-4 { grid-template-columns: repeat(4, 1fr); }

  @media (max-width: 480px) {
    .board.cols-4 {
      max-width: 340px;
      gap: 8px;
      margin: 0 auto;
    }
  }

  .board-empty {
    color: #fff;
    text-align: center;
    font-size: 1.05rem;
    font-weight: 600;
    text-shadow: 0 2px 6px rgba(0,0,0,0.25);
    padding: 30px 16px;
  }

  .family-panel {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .family-panel[hidden] {
    display: none;
  }

  .family-thumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .family-thumb {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }

  .family-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .family-thumb button,
  .family-thumb a {
    position: absolute;
    width: 20px;
    height: 20px;
    border: none;
    border-radius: 50%;
    font-size: 0.75rem;
    font-weight: 800;
    line-height: 20px;
    text-align: center;
    padding: 0;
    cursor: pointer;
  }

  .family-thumb button {
    top: -4px;
    right: -4px;
    background: var(--card-back-2);
    color: #fff;
  }

  .family-thumb a {
    bottom: -4px;
    left: -4px;
    background: var(--teal);
    color: #05332d;
    text-decoration: none;
  }

  .family-add-btn {
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 0.95rem;
    font-weight: 700;
    background: rgba(255,255,255,0.85);
    color: #4a2e8a;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
  }

  .family-hint {
    color: #fff;
    font-size: 0.85rem;
    text-align: center;
    text-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  .card {
    aspect-ratio: 1 / 1;
    perspective: 800px;
    cursor: pointer;
    touch-action: manipulation;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.45s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }

  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card.matched .card-inner {
    animation: pop 0.5s ease;
  }

  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.12); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 18%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(2rem, 9vw, 4.5rem);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }

  .card-front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(1.25) contrast(1.1) brightness(1.06);
  }

  .card-back {
    background: linear-gradient(145deg, var(--card-back-1), var(--card-back-2));
    color: rgba(255,255,255,0.85);
  }

  .card-back::after {
    content: "?";
    font-weight: 800;
    font-size: clamp(1.6rem, 7vw, 2.6rem);
  }

  .card-front {
    background: #fffdf6;
    transform: rotateY(180deg);
  }

  .card.matched .card-front {
    background: #eafff1;
    box-shadow: 0 0 0 4px var(--green), 0 4px 10px rgba(0,0,0,0.2);
  }

  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 10, 60, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
  }

  .win-overlay.show { display: flex; }

  .win-card {
    background: #fffdf6;
    border-radius: 24px;
    padding: 32px 28px;
    text-align: center;
    max-width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  .win-emoji {
    font-size: 3.5rem;
    margin-bottom: 4px;
  }

  .win-card h2 {
    margin: 6px 0 20px;
    color: #4a2e8a;
  }

  .win-card button {
    border: none;
    border-radius: 999px;
    padding: 12px 26px;
    font-size: 1.1rem;
    font-weight: 700;
    background: var(--pink);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.2);
  }

  #confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 30;
  }

  .confetti-piece {
    position: absolute;
    top: -10px;
    width: 10px;
    height: 14px;
    opacity: 0.9;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0.3;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🧠 Mia's Memory Game</h1>
      <div class="stats">
        <span id="pairsFound">0</span> / <span id="totalPairs">3</span> pairs
        <div class="stars" id="starsRow"></div>
      </div>
    </header>

    <div class="controls">
      <div class="control-group" id="themeButtons">
        <button data-theme="animals" class="active">🐶 Animals</button>
        <button data-theme="food">🍎 Food</button>
        <button data-theme="vehicles">🚗 Vehicles</button>
        <button data-theme="people">🧑 People</button>
        <button data-theme="family">👪 Family</button>
      </div>
      <div class="control-group" id="difficultyButtons">
        <button data-difficulty="easy" class="active">Easy</button>
        <button data-difficulty="medium">Medium</button>
        <button data-difficulty="hard">Hard</button>
      </div>
      <div class="control-group">
        <button class="new-game-btn" id="newGameBtn">🔀 New Game</button>
        <button type="button" id="muteBtn" aria-label="Mute sound" title="Mute sound">🔊</button>
      </div>
    </div>

    <div class="family-panel" id="familyPanel" hidden>
      <div class="family-thumbs" id="familyThumbs"></div>
      <div class="family-actions">
        <button type="button" class="family-add-btn" id="familyAddBtn">➕ Add Photos</button>
      </div>
      <div class="family-hint" id="familyHint"></div>
      <input type="file" id="familyPhotoInput" accept="image/*" multiple hidden>
    </div>

    <div class="board" id="board"></div>
  </div>

  <div class="win-overlay" id="winOverlay">
    <div class="win-card">
      <div class="win-emoji">🎉</div>
      <h2>You found them all!</h2>
      <button id="playAgainBtn">Play Again</button>
    </div>
  </div>

  <div id="confetti-layer"></div>

<script src="family-photos-manifest.js"></script>
<script>
(() => {
  const THEMES = {
    animals: ['🐶','🐱','🐻','🐰','🦁','🐸','🐵','🦊','🐷','🐮','🐔','🐨','🦋','🐢','🐬','🦄'],
    food:    ['🍎','🍌','🍇','🍓','🍉','🍕','🍦','🍩','🍪','🥕','🍒','🍭','🧁','🍋','🍊','🥝'],
    vehicles:['🚗','🚒','🚌','🚓','✈️','🚀','🚲','🚜','🚂','🛵','⛵','🚁','🚚','🏎️','🚑','🛺'],
    people:  ['👶','🧒','👦','👧','🧑','👨','👩','🧓','👴','👵','🧑‍🚀','👮','👩‍⚕️','🧑‍🍳','🧑‍🎨','🦸'],
    family:  []
  };

  const BUNDLED_FAMILY_PHOTOS = (typeof FAMILY_PHOTO_FILES !== 'undefined' ? FAMILY_PHOTO_FILES : [])
    .map(name => 'family-photos/' + name);

  const FAMILY_STORAGE_KEY = 'memoryMatch.familyPhotos';

  function loadFamilyPhotos() {
    try {
      const raw = localStorage.getItem(FAMILY_STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function saveFamilyPhotos() {
    try {
      localStorage.setItem(FAMILY_STORAGE_KEY, JSON.stringify(uploadedFamilyPhotos));
    } catch {
      // storage full or unavailable — photos still work for this session
    }
  }

  let uploadedFamilyPhotos = loadFamilyPhotos();

  function refreshFamilyTheme() {
    THEMES.family = [...BUNDLED_FAMILY_PHOTOS, ...uploadedFamilyPhotos];
  }

  refreshFamilyTheme();

  const DIFFICULTY = {
    easy:   { pairs: 3, cols: 3 },
    medium: { pairs: 6, cols: 4 },
    hard:   { pairs: 8, cols: 4 }
  };

  const boardEl = document.getElementById('board');
  const pairsFoundEl = document.getElementById('pairsFound');
  const totalPairsEl = document.getElementById('totalPairs');
  const starsRowEl = document.getElementById('starsRow');
  const winOverlay = document.getElementById('winOverlay');
  const themeButtons = document.getElementById('themeButtons');
  const difficultyButtons = document.getElementById('difficultyButtons');
  const newGameBtn = document.getElementById('newGameBtn');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const confettiLayer = document.getElementById('confetti-layer');
  const familyPanel = document.getElementById('familyPanel');
  const familyThumbs = document.getElementById('familyThumbs');
  const familyAddBtn = document.getElementById('familyAddBtn');
  const familyHint = document.getElementById('familyHint');
  const familyPhotoInput = document.getElementById('familyPhotoInput');
  const muteBtn = document.getElementById('muteBtn');

  let currentTheme = 'animals';
  let currentDifficulty = 'easy';
  let deck = [];
  let flippedIndices = [];
  let lockBoard = false;
  let pairsFound = 0;
  let totalPairs = 0;
  let audioCtx = null;
  let audioEnabled = localStorage.getItem('memoryMatch.audioEnabled') !== 'false';

  function shuffle(array) {
    const a = array.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playTones(freqs, duration = 0.18, gap = 0.09, type = 'sine', peakGain = 0.25) {
    if (!audioEnabled) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      const start = ctx.currentTime + i * gap;
      gainNode.gain.setValueAtTime(0.0001, start);
      gainNode.gain.exponentialRampToValueAtTime(peakGain, start + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      osc.connect(gainNode);
      gainNode.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + duration + 0.02);
    });
  }

  function playFlipSound() { playTones([550], 0.1, 0, 'triangle', 0.3); }
  function playMismatchSound() { playTones([349.23, 293.66], 0.2, 0.13, 'sine', 0.28); }
  function playMatchSound() { playTones([523.25, 659.25, 783.99]); }
  function playWinSound() { playTones([523.25, 659.25, 783.99, 1046.5], 0.22, 0.11); }

  function pickSymbols(theme, pairCount) {
    const pool = THEMES[theme];
    if (!pool.length) return [];
    if (pool.length >= pairCount) return shuffle(pool).slice(0, pairCount);
    // not enough unique symbols (e.g. a few family photos): repeat to fill the board
    const shuffledPool = shuffle(pool);
    const result = [];
    for (let i = 0; i < pairCount; i++) result.push(shuffledPool[i % shuffledPool.length]);
    return result;
  }

  function buildDeck(theme, pairCount) {
    const symbols = pickSymbols(theme, pairCount);
    const doubled = shuffle([...symbols, ...symbols]);
    return doubled.map((symbol, i) => ({ id: i, symbol, matched: false }));
  }

  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const size = 320;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const scale = Math.max(size / img.width, size / img.height);
          const w = img.width * scale, h = img.height * scale;
          ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.82));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function isImageSymbol(symbol) {
    return symbol.startsWith('data:image') || /\.(png|jpe?g|webp|gif)$/i.test(symbol);
  }

  function renderFamilyPanel() {
    familyPanel.hidden = currentTheme !== 'family';
    if (currentTheme !== 'family') return;

    familyThumbs.innerHTML = uploadedFamilyPhotos.map((src, i) => `
      <div class="family-thumb">
        <img src="${src}" alt="">
        <a href="${src}" download="family-photo-${i + 1}.jpg" aria-label="Save photo" title="Save photo">⬇</a>
        <button type="button" data-remove="${i}" aria-label="Remove photo">×</button>
      </div>
    `).join('');

    const builtInNote = BUNDLED_FAMILY_PHOTOS.length
      ? `${BUNDLED_FAMILY_PHOTOS.length} built-in photo${BUNDLED_FAMILY_PHOTOS.length === 1 ? '' : 's'} already in the game. `
      : '';
    familyHint.textContent = uploadedFamilyPhotos.length === 0
      ? `${builtInNote}Add your own photos below to mix in more!`
      : `${builtInNote}${uploadedFamilyPhotos.length} you added — tap ⬇ on a photo to save it if you want it made permanent.`;
  }

  function renderStars() {
    starsRowEl.textContent = '⭐'.repeat(pairsFound) + '☆'.repeat(Math.max(totalPairs - pairsFound, 0));
  }

  function updateStats() {
    pairsFoundEl.textContent = pairsFound;
    totalPairsEl.textContent = totalPairs;
    renderStars();
  }

  function renderBoard() {
    boardEl.className = 'board cols-' + DIFFICULTY[currentDifficulty].cols;
    boardEl.innerHTML = '';
    deck.forEach((card, index) => {
      const cardEl = document.createElement('div');
      cardEl.className = 'card';
      cardEl.dataset.index = index;
      const front = isImageSymbol(card.symbol)
        ? `<img src="${card.symbol}" alt="">`
        : card.symbol;
      cardEl.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back"></div>
          <div class="card-face card-front">${front}</div>
        </div>
      `;
      cardEl.addEventListener('click', () => onCardClick(index));
      boardEl.appendChild(cardEl);
    });
  }

  function onCardClick(index) {
    if (lockBoard) return;
    const cardEl = boardEl.children[index];
    if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

    cardEl.classList.add('flipped');
    playFlipSound();
    flippedIndices.push(index);

    if (flippedIndices.length === 2) {
      lockBoard = true;
      checkMatch();
    }
  }

  function checkMatch() {
    const [i1, i2] = flippedIndices;
    const c1 = deck[i1], c2 = deck[i2];
    const el1 = boardEl.children[i1], el2 = boardEl.children[i2];

    if (c1.symbol === c2.symbol) {
      c1.matched = c2.matched = true;
      el1.classList.add('matched');
      el2.classList.add('matched');
      playMatchSound();
      pairsFound++;
      updateStats();
      flippedIndices = [];
      lockBoard = false;
      if (pairsFound === totalPairs) {
        setTimeout(winGame, 500);
      }
    } else {
      playMismatchSound();
      setTimeout(() => {
        el1.classList.remove('flipped');
        el2.classList.remove('flipped');
        flippedIndices = [];
        lockBoard = false;
      }, 900);
    }
  }

  function spawnConfetti() {
    const colors = ['#ff6fa9', '#7b2ff7', '#21d4c4', '#ffc93c', '#34d16b'];
    for (let i = 0; i < 60; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (2 + Math.random() * 1.5) + 's';
      piece.style.animationDelay = (Math.random() * 0.4) + 's';
      confettiLayer.appendChild(piece);
      setTimeout(() => piece.remove(), 4000);
    }
  }

  function winGame() {
    playWinSound();
    spawnConfetti();
    winOverlay.classList.add('show');
  }

  function startGame() {
    winOverlay.classList.remove('show');
    confettiLayer.innerHTML = '';
    renderFamilyPanel();
    const { pairs } = DIFFICULTY[currentDifficulty];
    totalPairs = pairs;
    pairsFound = 0;
    flippedIndices = [];
    lockBoard = false;

    if (currentTheme === 'family' && THEMES.family.length === 0) {
      deck = [];
      updateStats();
      boardEl.className = 'board';
      boardEl.innerHTML = '<div class="board-empty">👪 Add some family photos above to start playing!</div>';
      return;
    }

    deck = buildDeck(currentTheme, pairs);
    updateStats();
    renderBoard();
  }

  themeButtons.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-theme]');
    if (!btn) return;
    currentTheme = btn.dataset.theme;
    [...themeButtons.children].forEach(b => b.classList.toggle('active', b === btn));
    startGame();
  });

  difficultyButtons.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-difficulty]');
    if (!btn) return;
    currentDifficulty = btn.dataset.difficulty;
    [...difficultyButtons.children].forEach(b => b.classList.toggle('active', b === btn));
    startGame();
  });

  newGameBtn.addEventListener('click', startGame);
  playAgainBtn.addEventListener('click', startGame);

  function updateMuteButton() {
    muteBtn.textContent = audioEnabled ? '🔊' : '🔇';
    muteBtn.classList.toggle('active', !audioEnabled);
    const label = audioEnabled ? 'Mute sound' : 'Unmute sound';
    muteBtn.setAttribute('aria-label', label);
    muteBtn.title = label;
  }

  muteBtn.addEventListener('click', () => {
    audioEnabled = !audioEnabled;
    try {
      localStorage.setItem('memoryMatch.audioEnabled', String(audioEnabled));
    } catch {
      // storage unavailable — preference just won't persist across reloads
    }
    updateMuteButton();
  });

  updateMuteButton();

  familyAddBtn.addEventListener('click', () => familyPhotoInput.click());

  familyPhotoInput.addEventListener('change', async () => {
    const files = [...familyPhotoInput.files];
    familyPhotoInput.value = '';
    if (!files.length) return;
    const resized = await Promise.all(files.map(f => resizeImage(f).catch(() => null)));
    resized.filter(Boolean).forEach(dataUrl => uploadedFamilyPhotos.push(dataUrl));
    saveFamilyPhotos();
    refreshFamilyTheme();
    startGame();
  });

  familyThumbs.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-remove]');
    if (!btn) return;
    uploadedFamilyPhotos.splice(Number(btn.dataset.remove), 1);
    saveFamilyPhotos();
    refreshFamilyTheme();
    startGame();
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  startGame();
})();
</script>
</body>
</html>
